<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ePTW — Isolation points (execution)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="eptw.css">
<style>
  :root{--module:var(--c-iso); --module-bg:var(--c-iso-bg)}
  html{scroll-behavior:smooth}
  .st-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 11px;border-radius:12px;background:var(--st-inspect-bg);color:var(--st-inspect)}
  .st-pill .d{width:8px;height:8px;border-radius:50%;background:var(--st-inspect)}
  .ft-links{display:flex;gap:10px;align-items:center;margin-top:3px}
  .ft-links a{font-size:12px;color:var(--brand);text-decoration:none;cursor:pointer}
  .btn-next{background:var(--c-iso);border:1px solid var(--c-iso);color:#fff;font-weight:600;padding:9px 18px;border-radius:var(--radius);cursor:pointer;font-family:inherit}
  .btn-next:hover{background:#c9791f}
  .btn-next:disabled{opacity:.45;cursor:not-allowed}
  .content{padding:22px 24px 80px;max-width:1400px;margin:0 auto}
  /* progress strip of the isolation lifecycle */
  .life{display:flex;align-items:center;gap:0;margin-bottom:20px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px 18px;overflow-x:auto}
  .life-step{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);white-space:nowrap}
  .life-step .ls-dot{width:9px;height:9px;border-radius:50%;background:var(--line)}
  .life-step.done{color:var(--ok)}
  .life-step.done .ls-dot{background:var(--ok)}
  .life-step.current{color:var(--c-iso);font-weight:700}
  .life-step.current .ls-dot{background:var(--c-iso);box-shadow:0 0 0 3px var(--c-iso-bg)}
  .life-sep{width:26px;height:1px;background:var(--line);margin:0 10px;flex-shrink:0}
  /* action toolbar */
  .exec-bar{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 16px;margin-bottom:14px;flex-wrap:wrap;position:sticky;top:calc(var(--header-h) + 8px);z-index:20}
  .exec-bar .sel-count{font-size:13px;color:var(--muted)}
  .exec-bar .sel-count b{color:var(--ink)}
  .filter-sel{border:1px solid var(--line);border-radius:var(--radius);padding:8px 11px;font-size:13px;font-family:inherit;background:#fff}
  .btn-iso{background:var(--st-issued);border:1px solid var(--st-issued);color:#fff;font-weight:600;padding:9px 15px;border-radius:var(--radius);cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:7px}
  .btn-iso:hover{background:#178768}
  .btn-deiso{background:#fff;border:1px solid var(--st-issued);color:var(--st-issued);font-weight:600;padding:9px 15px;border-radius:var(--radius);cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:7px}
  .btn-deiso:hover{background:var(--st-issued-bg)}
  .btn-iso:disabled,.btn-deiso:disabled{opacity:.4;cursor:not-allowed}
  .exec-bar .spacer{margin-left:auto}
  .btn-ghost{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:var(--radius);padding:9px 13px;font-size:13px;cursor:pointer;font-family:inherit;font-weight:600;display:inline-flex;gap:7px;align-items:center}
  .btn-ghost:hover{border-color:var(--c-iso);color:var(--c-iso)}
  /* print scope row */
  .print-row{display:flex;align-items:center;gap:14px;font-size:12.5px;color:var(--muted);margin-bottom:14px;padding:0 4px}
  .print-row .seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .print-row .seg button{border:0;background:#fff;padding:7px 12px;font-size:12.5px;cursor:pointer;font-family:inherit;color:var(--muted)}
  .print-row .seg button.on{background:var(--c-iso-bg);color:var(--c-iso);font-weight:600}
  .print-row select{border:1px solid var(--line);border-radius:var(--radius);padding:7px 10px;font-size:12.5px;font-family:inherit}
  /* points table */
  .tbl-wrap{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .tbl-scroll{overflow-x:auto}
  table.ex{width:100%;min-width:1180px;border-collapse:collapse;font-size:13px}
  table.ex thead th{background:#F7F9FB;text-align:left;padding:11px 12px;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line-soft);white-space:nowrap}
  table.ex tbody td{padding:11px 12px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
  table.ex tbody tr:last-child td{border-bottom:0}
  table.ex tbody tr.sel-row{background:var(--c-iso-bg)}
  table.ex tbody tr:hover{background:#F7F9FB}
  table.ex tbody tr.sel-row:hover{background:#F7E9D4}
  .chk{width:16px;height:16px;cursor:pointer;accent-color:var(--c-iso)}
  .c-ord{width:44px;text-align:center;color:var(--muted);font-weight:600}
  .c-tag{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
  .type-pill{font-size:11px;font-weight:600;padding:3px 9px;border-radius:10px;white-space:nowrap}
  .tp-elec{background:#FFF4DE;color:var(--c-iso-ink)}
  .tp-mech{background:#E7ECF1;color:#3B4657}
  .tp-inst{background:#E5EEF7;color:#2C6FB5}
  .tp-proc{background:#E3F5EE;color:#1C9E7A}
  .lock{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:12.5px;white-space:nowrap}
  .lock-on{color:var(--st-issued)}
  .lock-off{color:var(--muted)}
  .lock-ic{font-size:14px}
  .lockno{font-variant-numeric:tabular-nums;font-size:12.5px}
  .lockno input{width:78px;border:1px solid var(--line);border-radius:var(--radius);padding:6px 8px;font-size:12.5px;font-family:inherit}
  .test-flag{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:10px;background:var(--warn-bg);color:var(--warn);cursor:pointer;white-space:nowrap}
  .test-flag.off{background:var(--st-created-bg);color:var(--muted)}
  .std-badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:10px;background:var(--ok-bg);color:#0F6B4F}
  .finalpos{width:60px;border:1px solid var(--line);border-radius:var(--radius);padding:6px 8px;font-size:12.5px;font-family:inherit}
  .unable-link{font-size:11.5px;color:var(--danger);cursor:pointer;text-decoration:underline}
  .row-muted{color:var(--muted)}
  /* toast */
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#1C2530;color:#fff;padding:13px 20px;border-radius:8px;font-size:13.5px;box-shadow:0 10px 30px rgba(20,28,38,.28);opacity:0;transition:.25s;z-index:60;display:flex;align-items:center;gap:10px}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast .t-ic{width:20px;height:20px;border-radius:50%;background:var(--st-issued);display:grid;place-items:center;font-size:12px}
  .ip-expand-btn{display:block;width:100%;border:1px dashed var(--line);background:#fff;border-radius:var(--radius);padding:10px;font-size:12.5px;font-weight:600;font-family:inherit;cursor:pointer;color:var(--c-iso);margin-top:10px}
  .ip-expand-btn:hover{background:var(--c-iso-bg);border-style:solid;border-color:var(--c-iso)}
</style>
</head>
<body>
<div class="focus-bar">
  <a class="focus-exit" href="12_isolation_live.html"><span class="x">✕</span> Back to isolation</a>
  <div class="focus-sep"></div>
  <div>
    <div class="ft-t">Isolation points <span class="ft-ref">27B-ICC-02540</span> <span class="st-pill" id="stPill"><span class="d"></span><span id="stTxt">ISOLATING</span></span></div>
    <div class="ft-links"><a href="12_isolation_live.html">← Certificate</a><a href="14_isolation_workflow.html">🗺 Workflow</a><a href="#">🖨 Print recap</a></div>
  </div>
  <div class="focus-actions">
    <button class="btn-next" id="confirmBtn" onclick="confirmAll()">Confirm isolation →</button>
  </div>
</div>

<div class="content">
  <!-- lifecycle strip -->
  <div class="life">
    <div class="life-step done"><span class="ls-dot"></span>Authorised</div>
    <div class="life-sep"></div>
    <div class="life-step current"><span class="ls-dot"></span>Isolating</div>
    <div class="life-sep"></div>
    <div class="life-step"><span class="ls-dot"></span>Isolation-in-Place</div>
    <div class="life-sep"></div>
    <div class="life-step"><span class="ls-dot"></span>De-isolating</div>
    <div class="life-sep"></div>
    <div class="life-step"><span class="ls-dot"></span>Closed</div>
  </div>

  <!-- action toolbar -->
  <div class="exec-bar">
    <span class="sel-count"><b id="selN">0</b> of <b id="totN">6</b> selected</span>
    <div class="focus-sep" style="height:22px"></div>
    <label style="font-size:12.5px;color:var(--muted)">Filter type</label>
    <select class="filter-sel" id="typeFilter" onchange="applyFilter()">
      <option value="">All types</option>
      <option>Electrical</option><option>Instruments</option><option>Mechanical</option><option>Process</option>
    </select>
    <button class="btn-iso" id="isoBtn" onclick="massIsolate()" disabled>🔒 Isolate selected</button>
    <button class="btn-deiso" id="deisoBtn" onclick="massDeisolate()" disabled>🔓 De-isolate selected</button>
    <div class="spacer"></div>
    <button class="btn-ghost" onclick="alert('Inspect selected points')">👁 Inspect</button>
    <button class="btn-ghost" onclick="alert('Inspect by Auditor')">🔍 Inspect by Auditor</button>
  </div>

  <!-- print scope -->
  <div class="print-row">
    <span>Print for:</span>
    <div class="seg"><button class="on">All permits</button><button>Single permit</button></div>
    <select><option>27B-CW-01784</option><option>27B-CW-01799</option></select>
    <button class="btn-ghost" onclick="alert('Print isolation tags')">🏷 Isolation tag print</button>
  </div>

  <!-- table -->
  <div class="tbl-wrap"><div class="tbl-scroll">
    <table class="ex">
      <thead><tr>
        <th style="width:34px"><input type="checkbox" class="chk" id="chkAll" onchange="toggleAll(this)"></th>
        <th class="c-ord">#</th><th>Tag</th><th>Description</th><th>Type</th><th>Method</th>
        <th>Status</th><th>Lock no.</th><th>In test plan</th><th>Std</th><th>Final pos</th><th>Unable</th>
      </tr></thead>
      <tbody id="exBody"></tbody>
    </table>
  </div></div>
</div>

<div class="toast" id="toast"><span class="t-ic">✓</span><span id="toastMsg">Done</span></div>

<script>
  const PTS=[
    {ord:1,tag:'P200AEM',desc:'P200A KO Drum Pump Motor SWBD100 A10.6',type:'Electrical',method:'Fuse removed',state:'not',lock:'',test:false,std:''},
    {ord:2,tag:'LBC-V-201',desc:'Open drains inlet isolation valve',type:'Process',method:'Valve closed & locked',state:'not',lock:'',test:true,std:'II'},
    {ord:3,tag:'LBC-V-202',desc:'Open drains outlet isolation valve',type:'Process',method:'Valve closed & locked',state:'not',lock:'',test:true,std:'II'},
    {ord:4,tag:'P200BEM',desc:'P200B KO Drum Pump Motor SWBD100 B14.4',type:'Electrical',method:'Fuse removed',state:'not',lock:'',test:false,std:''},
    {ord:5,tag:'P1910AEM',desc:'P1910A Methanol Pump Motor SWBD100 A12.3',type:'Electrical',method:'Fuse removed',state:'not',lock:'',test:false,std:''},
    {ord:6,tag:'LBC-V-450',desc:'HP condensate transfer isolation valve',type:'Process',method:'Valve closed & locked',state:'not',lock:'',test:false,std:'III'}
  ];
  // demo: extend to a realistic large set (up to 100 supported)
  (function(){
    var types=['Electrical','Process','Mechanical','Instruments'];
    var methods={Electrical:'Fuse removed',Process:'Valve closed & locked',Mechanical:'Spade fitted',Instruments:'Signal isolated'};
    for(var k=7;k<=34;k++){
      var t=types[k%4];
      PTS.push({ord:k,tag:(t==='Process'?'LBC-V-':'PT-')+(500+k),desc:t+' isolation point #'+k,type:t,method:methods[t],state:'not',lock:'',test:false,std:''});
    }
  })();
  const sel=new Set();
  function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}
  function typePill(t){const m={Electrical:'tp-elec',Mechanical:'tp-mech',Instruments:'tp-inst',Process:'tp-proc'};return '<span class="type-pill '+(m[t]||'')+'">'+t+'</span>';}
  function stateCell(p){
    if(p.state==='iso') return '<span class="lock lock-on"><span class="lock-ic">🔒</span>Isolated</span>';
    return '<span class="lock lock-off"><span class="lock-ic">🔓</span>Not set</span>';
  }
  function lockCell(p){
    if(p.state==='iso') return '<span class="lockno"><input value="'+esc(p.lock||('LK-'+(2200+p.ord)))+'"></span>';
    return '<span class="row-muted">—</span>';
  }
  function testCell(p){
    return '<span class="test-flag'+(p.test?'':' off')+'" onclick="toggleTest('+(p.ord-1)+')">'+(p.test?'In test plan':'—')+'</span>';
  }
  function stdCell(p){return p.std?'<span class="std-badge">'+p.std+' — Proved</span>':'<span class="row-muted">—</span>';}
  function renderIpExpand(total){
    var host=document.getElementById('ipExpandHost');
    if(!host){ host=document.createElement('div'); host.id='ipExpandHost';
      var wrap=document.querySelector('.tbl-scroll')||document.getElementById('exBody').closest('table').parentNode;
      wrap.parentNode.insertBefore(host, wrap.nextSibling); }
    var hidden=Math.max(0,total-15);
    if(hidden>0 || ipExpanded){
      host.innerHTML='<button class="ip-expand-btn" onclick="toggleIpExpand()">'+(ipExpanded?'▲ Show less':('▾ Show all '+total+' points ('+hidden+' more)'))+'</button>';
    } else { host.innerHTML=''; }
  }
  function toggleIpExpand(){ ipExpanded=!ipExpanded; render(); }
  function filtered(){const f=document.getElementById('typeFilter').value;return PTS.map((p,i)=>({p,i})).filter(o=>!f||o.p.type===f);}
  var IP_LIMIT=15, ipExpanded=false;
  function render(){
    const tb=document.getElementById('exBody');
    const all=filtered();
    const shown = ipExpanded ? all : all.slice(0, IP_LIMIT);
    tb.innerHTML=shown.map(({p,i})=>{
      const on=sel.has(i);
      return '<tr class="'+(on?'sel-row':'')+'">'+
        '<td><input type="checkbox" class="chk" '+(on?'checked':'')+' onchange="toggleOne('+i+',this)"></td>'+
        '<td class="c-ord">'+p.ord+'</td>'+
        '<td class="c-tag">'+esc(p.tag)+'</td>'+
        '<td>'+esc(p.desc)+'</td>'+
        '<td>'+typePill(p.type)+'</td>'+
        '<td>'+esc(p.method)+'</td>'+
        '<td>'+stateCell(p)+'</td>'+
        '<td>'+lockCell(p)+'</td>'+
        '<td>'+testCell(p)+'</td>'+
        '<td>'+stdCell(p)+'</td>'+
        '<td>'+(p.state==='iso'?'<input class="finalpos" placeholder="—">':'<span class="row-muted">—</span>')+'</td>'+
        '<td><span class="unable-link" onclick="markUnable('+i+')">Unable?</span></td>'+
      '</tr>';
    }).join('');
    document.getElementById('selN').textContent=sel.size;
    document.getElementById('totN').textContent=PTS.length;
    renderIpExpand(all.length);
    const anySel=sel.size>0;
    document.getElementById('isoBtn').disabled=!anySel;
    document.getElementById('deisoBtn').disabled=!anySel;
    // confirm enabled only when all isolated
    const allIso=PTS.every(p=>p.state==='iso');
    const cb=document.getElementById('confirmBtn');
    cb.disabled=!allIso;
    cb.textContent=allIso?'Confirm isolation →':'Isolate all points to confirm';
  }
  function toggleOne(i,el){el.checked?sel.add(i):sel.delete(i);render();}
  function toggleAll(el){sel.clear();if(el.checked)filtered().forEach(({i})=>sel.add(i));render();}
  function applyFilter(){sel.clear();document.getElementById('chkAll').checked=false;render();}
  function toggleTest(i){PTS[i].test=!PTS[i].test;render();}
  function massIsolate(){
    let n=0;sel.forEach(i=>{if(PTS[i].state!=='iso'){PTS[i].state='iso';PTS[i].lock='LK-'+(2200+PTS[i].ord);n++;}});
    sel.clear();document.getElementById('chkAll').checked=false;render();toast('🔒 '+n+' point(s) isolated — locks applied');
  }
  function massDeisolate(){
    let n=0;sel.forEach(i=>{if(PTS[i].state==='iso'){PTS[i].state='not';PTS[i].lock='';n++;}});
    sel.clear();document.getElementById('chkAll').checked=false;render();toast('🔓 '+n+' point(s) de-isolated');
  }
  function markUnable(i){alert('Mark point '+PTS[i].tag+' as UNABLE TO IMPLEMENT — capture reason (blocks confirmation until resolved).');}
  function confirmAll(){toast('✓ All points isolated → status: Isolation-in-Place');setTimeout(()=>location.href='12_isolation_live.html',900);}
  let tt;
  function toast(m){const t=document.getElementById('toast');document.getElementById('toastMsg').textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2600);}
  render();
</script>
</body>
</html>
